[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "conversation-bus"
version = "0.1.0"
description = "Simple, exportable conversation bus for multi-agent AI coordination"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

[tool.pytest.ini_options]
testpaths = ["test_conversation_bus.py"]
